<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingham Universuty Undergraduate Portal</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-div">
        <div class="header">
    <header>
        <h1> MyBHU</h1>
        <p> Undergraduate Student portal</p>

    </header>
  </div>
    

    <main>
        <section class="login-container">

            <h2>Welcome Back!</h2>
            <h3>Sign in to continue to Bingham University Undergraduate Portal.</h3>

            <form>
                <label for="student-number">
    Student / Admission Number
 </label>
 <br>

 <input class="input"
    type="text"
    id="student-number"
    name="student-number"
    autocomplete="username"
 > <br>
  <label for="student-password">
    Password <span style="margin-left: 310px; color: rgb(3, 159, 243);">forget Password?</span>
 </label>
 <br>

 <input class="input"
    type="text"
    id="student-password"
    name="student-password"
    autocomplete="userpassword"
 > 

 <div class="checkbox">
        <input class="checkinput"  type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>
    </div>

    <button class="btn" type="submit" class="input">Sign In</button>
    <div class="google">
     <span><label >sign-in with google</label></span>
    </div>
       <hr  style="margin-top: 30px; color:rgb(68, 64, 64);">
     <br>
     <div style="text-align: center;"><label for="">sign-in with passkey</label></div>


            </form>

        </section>
    </main>
    </div>

</body>
</html>
